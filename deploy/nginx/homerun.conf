# Homerun — host nginx edge config.
#
# This file lives on the deploy host (not inside any container).
# Place it at /etc/nginx/sites-available/homerun, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Architecture:
#
#   Internet --> host nginx (TLS, basic auth) --> 127.0.0.1:3000
#                                                  |
#                                                  v
#                                       homerun-frontend container
#                                          |  static SPA (index.html, /assets/*)
#                                          |  /api/*  -> backend:8000  (docker net)
#                                          \  /ws     -> backend:8000  (docker net)
#
# The in-container nginx (frontend/nginx.conf) already dispatches
# /api and /ws to the backend over the docker compose network, so
# host nginx only needs ONE upstream pass-through. Add explicit
# /api or /ws blocks here only if you ever decide to bypass the
# frontend container.
#
# Pre-requisites on the host:
#   - docker compose stack running with FRONTEND_PORT=127.0.0.1:3000
#     in .env so the frontend container is loopback-only
#     (BACKEND/POSTGRES/REDIS are already loopback in compose).
#   - TLS cert + key in /etc/ssl/certs/homerun.crt and
#     /etc/ssl/private/homerun.key (Let's Encrypt or self-signed).
#   - Basic auth file: htpasswd -c /etc/nginx/.htpasswd <user>
#   - ufw / firewall: allow 22, 80, 443; deny everything else.

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/homerun.crt;
    ssl_certificate_key /etc/ssl/private/homerun.key;

    auth_basic           "Homerun";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Edge cap. The in-container frontend nginx caps at 25m today
    # (frontend/nginx.conf) — bump both if you ever need larger
    # dataset / model uploads.
    client_max_body_size 50m;

    # Single pass-through to the dockerized frontend nginx.
    # Handles SPA, /api/*, /ws — all same-origin behind this edge.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws (opportunities feed, scanner
        # status, trade events). Header pair is no-op for plain HTTP.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running endpoints: SSE (LLM chat), backtest replays,
        # dataset exports. Backend's per-route timeout still applies.
        proxy_buffering     off;
        proxy_read_timeout  3600;
        proxy_send_timeout  3600;
    }
}
